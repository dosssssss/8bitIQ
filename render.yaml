# Render Blueprint for the 8bitIQ game server.
# On render.com: New > Blueprint, pick this repo, then fill in the two
# Supabase secrets when Render asks for them.
services:
  - type: web
    name: 8bitiq
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_STORE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
